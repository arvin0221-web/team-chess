<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>西西西洋棋 Online</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

</head>

<body>

<h1>西西西洋棋</h1>

<div id="menu">

<h2>房間系統</h2>

<input id="roomInput" placeholder="輸入房間ID">

<br><br>

<button id="createRoomBtn">創建房間</button>

<button id="joinRoomBtn">加入房間</button>

<br><br>

<button id="chooseWhiteBtn">選擇白棋</button>

<button id="chooseBlackBtn">選擇黑棋</button>

<br><br>

<p id="roomStatus">尚未加入房間</p>

</div>


<hr>


<div id="gameArea">

<h2 id="turnDisplay">等待開始</h2>

<div id="board"></div>

<div id="gameControls">

<button id="restartGameBtn">重新開始</button>

</div>

</div>


<hr>


<div id="chatArea">

<h2>聊天室</h2>

<div id="chatMessages"></div>

<input id="chatInput">

<button id="sendChatBtn">送出</button>

</div>



<!-- 系統腳本 -->

<script src="firebase-init.js"></script>

<script src="room-system.js"></script>

<script src="network-sync.js"></script>

<script src="board-render.js"></script>

<script src="drag-system.js"></script>

<script src="chess-engine.js"></script>

<script src="cheat-rules.js"></script>

<script src="checkmate-system.js"></script>

<script src="chat-system.js"></script>

<script src="timer-system.js"></script>

<script src="main.js"></script>

</body>

</html>
